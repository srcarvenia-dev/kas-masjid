<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Kas Masjid</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:15px;
}
.container{
  max-width:900px;
  margin:auto;
}
h1{
  text-align:center;
  margin-bottom:20px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}
.summary{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.box{
  flex:1;
  min-width:150px;
  padding:15px;
  border-radius:8px;
  color:white;
  text-align:center;
}
.masuk{ background:#198754;}
.keluar{ background:#dc3545;}
.saldo{ background:#0d6efd;}

select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  width:200px;
}

.table-wrapper{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#0d6efd;
  color:white;
}
.footer{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  color:#666;
}
@media(max-width:600px){
  th,td{font-size:12px;}
  select{width:100%;}
}
</style>
</head>
<body>

<div class="container">

<h1>Laporan Kas Masjid</h1>

<div class="card">
<label><strong>Filter Bulan:</strong></label><br><br>
<select id="filterBulan" onchange="tampilkanData()">
  <option value="all">Semua</option>
</select>
</div>

<div class="card summary">
  <div class="box masuk">
    <h3>Total Penerimaan</h3>
    <p id="totalMasuk">Rp 0</p>
  </div>
  <div class="box keluar">
    <h3>Total Pengeluaran</h3>
    <p id="totalKeluar">Rp 0</p>
  </div>
  <div class="box saldo">
    <h3>Saldo Akhir</h3>
    <p id="saldoAkhir">Rp 0</p>
  </div>
</div>

<div class="card">
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Uraian</th>
<th>Penerimaan</th>
<th>Pengeluaran</th>
</tr>
</thead>
<tbody id="tabelData"></tbody>
</table>
</div>
</div>

<div class="footer">
Sistem Laporan Kas Masjid - Terhubung Google Sheet
</div>

</div>

<script>
const url = "https://script.google.com/macros/s/AKfycbx5su45hlPg1ION0A3Qal97yNnSfW9LQdRBpDQiXCoZdWi4BOQb_KFjcM7piPI8yYFy1Q/exec";

let semuaData = [];

function formatRupiah(angka){
  return "Rp " + Number(angka).toLocaleString("id-ID");
}

function formatTanggal(tgl){
  let date = new Date(tgl);
  return date.toLocaleDateString("id-ID");
}

function isiFilter(){
  let bulanSet = new Set();

  semuaData.slice(1).forEach(row=>{
    let date = new Date(row[0]);
    let bulan = date.getFullYear()+"-"+(date.getMonth()+1).toString().padStart(2,"0");
    bulanSet.add(bulan);
  });

  let select = document.getElementById("filterBulan");
  bulanSet.forEach(b=>{
    select.innerHTML += `<option value="${b}">${b}</option>`;
  });
}

function tampilkanData(){
  let filter = document.getElementById("filterBulan").value;

  let totalMasuk = 0;
  let totalKeluar = 0;
  let html = "";

  semuaData.slice(1).forEach(row=>{
    let date = new Date(row[0]);
    let bulan = date.getFullYear()+"-"+(date.getMonth()+1).toString().padStart(2,"0");

    if(filter !== "all" && bulan !== filter) return;

    let tanggal = formatTanggal(row[0]);
    let uraian = row[1];
    let masuk = Number(row[2]) || 0;
    let keluar = Number(row[3]) || 0;

    totalMasuk += masuk;
    totalKeluar += keluar;

    html += `
    <tr>
      <td>${tanggal}</td>
      <td>${uraian}</td>
      <td>${masuk ? formatRupiah(masuk) : "-"}</td>
      <td>${keluar ? formatRupiah(keluar) : "-"}</td>
    </tr>`;
  });

  document.getElementById("tabelData").innerHTML = html;
  document.getElementById("totalMasuk").innerText = formatRupiah(totalMasuk);
  document.getElementById("totalKeluar").innerText = formatRupiah(totalKeluar);
  document.getElementById("saldoAkhir").innerText = formatRupiah(totalMasuk - totalKeluar);
}

fetch(url)
.then(res=>res.json())
.then(data=>{
  semuaData = data;
  isiFilter();
  tampilkanData();
});
</script>

</body>
</html>
