<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Masjid</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;padding:15px;}
.container{max-width:900px;margin:auto;}
h1{text-align:center;}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.05);}
.summary{display:flex;flex-wrap:wrap;gap:10px;}
.box{flex:1;min-width:150px;padding:15px;border-radius:8px;color:white;text-align:center;}
.masuk{background:#198754;}
.keluar{background:#dc3545;}
.saldo{background:#0d6efd;}
select{padding:8px;border-radius:6px;}
.table-wrapper{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:600px;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
th{background:#0d6efd;color:white;}
</style>
</head>
<body>

<div class="container">
<h1>Laporan Kas Masjid</h1>

<div class="card">
<select id="filterBulan" onchange="tampilkanData()">
<option value="all">Semua Bulan</option>
</select>
</div>

<div class="card summary">
<div class="box masuk"><h3>Penerimaan</h3><p id="totalMasuk">Rp 0</p></div>
<div class="box keluar"><h3>Pengeluaran</h3><p id="totalKeluar">Rp 0</p></div>
<div class="box saldo"><h3>Saldo</h3><p id="saldoAkhir">Rp 0</p></div>
</div>

<div class="card table-wrapper">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Uraian</th>
<th>Penerimaan</th>
<th>Pengeluaran</th>
</tr>
</thead>
<tbody id="tabelData"></tbody>
</table>
</div>
</div>

<script>
const url="https://script.google.com/macros/s/AKfycbx5su45hlPg1ION0A3Qal97yNnSfW9LQdRBpDQiXCoZdWi4BOQb_KFjcM7piPI8yYFy1Q/exec";
let semuaData=[];

function rupiah(a){return "Rp "+Number(a).toLocaleString("id-ID");}
function tgl(t){return new Date(t).toLocaleDateString("id-ID");}

function isiFilter(){
 let s=new Set();
 semuaData.slice(1).forEach(r=>{
   let d=new Date(r[0]);
   let b=d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0");
   s.add(b);
 });
 let f=document.getElementById("filterBulan");
 s.forEach(b=>{f.innerHTML+=`<option value="${b}">${b}</option>`});
}

function tampilkanData(){
 let f=document.getElementById("filterBulan").value;
 let masuk=0,keluar=0,html="";
 semuaData.slice(1).forEach(r=>{
   let d=new Date(r[0]);
   let b=d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0");
   if(f!=="all"&&b!==f)return;
   let m=Number(r[2])||0;
   let k=Number(r[3])||0;
   masuk+=m;keluar+=k;
   html+=`<tr>
   <td>${tgl(r[0])}</td>
   <td>${r[1]}</td>
   <td>${m?rupiah(m):"-"}</td>
   <td>${k?rupiah(k):"-"}</td>
   </tr>`;
 });
 document.getElementById("tabelData").innerHTML=html;
 document.getElementById("totalMasuk").innerText=rupiah(masuk);
 document.getElementById("totalKeluar").innerText=rupiah(keluar);
 document.getElementById("saldoAkhir").innerText=rupiah(masuk-keluar);
}

fetch(url)
.then(r=>r.json())
.then(d=>{semuaData=d;isiFilter();tampilkanData();});

if("serviceWorker"in navigator){
 navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
